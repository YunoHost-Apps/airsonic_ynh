packaging_format = 2

id = "airsonic"
name = "Airsonic-Advanced"
description.en = "Stream and manage your music collection"
description.fr = "Streamez et gérez votre collection de musique"

version = "11.0.20240424015024~ynh1"

maintainers = []

[upstream]
license = "GPL-3.0-or-later"
admindoc = "https://airsonic.github.io/docs/"
code = "https://github.com/airsonic-advanced/airsonic-advanced"

[integration]
yunohost = ">= 11.2"
architectures = "all"
multi_instance = true
ldap = true
sso = true
disk = "50M"
ram.build = "500M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/airsonic"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]
        [resources.sources.main]
        url = "https://github.com/airsonic-advanced/airsonic-advanced/releases/download/11.0.0-SNAPSHOT.20240424015024/airsonic.war"
        sha256 = "7c35acb52d3be81797139e5a39e312499bae62138b2d501f8d1199467324b33e"
        rename = "airsonic.war"
        extract = false

    [resources.ports]

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs =["Podcasts", "Playlists"]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "ffmpeg, x264, x265, lame, xmp, bash, fonts-dejavu, gosu"
    packages_from_raw_bash = """
    if [[ $YNH_DEBIAN_VERSION == "bullseye" ]]; then
        echo "openjdk-11-jre";
    elif [[ $YNH_DEBIAN_VERSION == "bookworm" ]]; then
        echo "openjdk-17-jre";
    fi
    """
